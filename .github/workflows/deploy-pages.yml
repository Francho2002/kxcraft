name: Deploy KxCraft informational site and Packwiz

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/scripts/Validate-GitHubPagesPackwizSnapshot.ps1'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kxcraft-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the public repository
        uses: actions/checkout@v6
      - name: Validate informational site and immutable Packwiz release
        shell: pwsh
        run: |
          ./.github/scripts/Validate-GitHubPagesPackwizSnapshot.ps1 -SiteRoot ./site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only the verified site and Packwiz manifests
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/
      - name: Deploy verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
